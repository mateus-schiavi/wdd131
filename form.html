<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles/products.css">
    <script src="scripts/review-products.js" defer></script>
    <title>Product Review</title>
</head>

<body>

<header>
  <h1>Product Review</h1>
</header>

<main class="card">
  <form id="reviewForm">

    <label>Product Name</label>
    <select id="product" required>
      <option value="">Choose a Product ...</option>
    </select>

    <label>Overall Rating</label>
    <div class="rating">
      <label><input type="radio" name="rating" value="1"> ★</label>
      <label><input type="radio" name="rating" value="2"> ★★</label>
      <label><input type="radio" name="rating" value="3"> ★★★</label>
      <label><input type="radio" name="rating" value="4"> ★★★★</label>
      <label><input type="radio" name="rating" value="5"> ★★★★★</label>
    </div>

    <label>Date of Installation</label>
    <input type="date" id="date">

    <label>
      Which features did you find useful in the product?
      <span>(Check all that apply)</span>
    </label>

    <div class="checkbox-group">
      <label><input type="checkbox" value="Durability"> Durability</label>
      <label><input type="checkbox" value="Ease of Use"> Ease of Use</label>
      <label><input type="checkbox" value="Performance"> Performance</label>
      <label><input type="checkbox" value="Design"> Design</label>
    </div>

    <label>Written Review <span>(Optional)</span></label>
    <textarea id="comment"></textarea>

    <label>Your Name <span>(Optional)</span></label>
    <input type="text" id="name">

    <button type="submit">Post Review</button>

  </form>

  <div id="reviews"></div>
</main>
</body>

</html>
