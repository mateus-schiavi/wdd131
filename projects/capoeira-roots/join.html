<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="author" content="Mateus de Sousa Schiavi">
    <meta name="description"
        content="Capoeira Roots explores the history, culture, and benefits of capoeira. Test your knowledge and join our community today.">
    <title>Capoeira Roots</title>

    <link rel="stylesheet" href="css/styles.css">
    <script src="js/join.js" defer></script>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600&family=Roboto&display=swap" rel="stylesheet">
</head>

<body>
    <header>
        <div class="container header-flex">
            <h1>Capoeira Roots</h1>
            <nav>
                <ul>
                    <li><a href="index.html">Home</a></li>
                    <li><a href="benefits.html">Benefits</a></li>
                    <li><a href="quiz.html">Quiz</a></li>
                    <li><a href="join.html">Join</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <section class="join">
        <div class="container">
            <form id="joinForm">
                <fieldset>
                    <legend>Join Capoeira Roots</legend>

                    <label for="name">Full Name</label>
                    <input type="text" id="name" required>

                    <label for="email">Email</label>
                    <input type="email" id="email" required>

                    <label for="level">Experience Level</label>
                    <select id="level">
                        <option value="Beginner">Beginner</option>
                        <option value="Intermediate">Intermediate</option>
                        <option value="Advanced">Advanced</option>
                    </select>

                    <button type="submit">Register</button>
                </fieldset>
            </form>

            <div id="confirmation"></div>
        </div>
    </section>


    <footer>
        <p><span id="currentYear"></span></p>
        <p id="lastModified"></p>
    </footer>
</body>

</html>
